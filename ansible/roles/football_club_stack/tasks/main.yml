---
- name: Reject debug mode for the production Invoice Ninja application
  ansible.builtin.assert:
    that:
      - football_club_stack_invoiceninja_app_debug | string | lower == 'false'
    fail_msg: Invoice Ninja uses APP_ENV=production and must have APP_DEBUG=false

- name: Validate release refresh service selection
  ansible.builtin.assert:
    that:
      - football_club_stack_refresh_services | length == 8
      - football_club_stack_refresh_services | unique | length == 8
      - >-
        football_club_stack_refresh_services | sort | join(',') ==
        'docuseal,invoiceninja,mms-postgres,mms-qcluster,mms-web,nginx,ninja-cache,ninja-db'
    fail_msg: >-
      Refresh exactly the eight registry-backed services: docuseal,
      mms-postgres, mms-qcluster, mms-web, ninja-cache, ninja-db, nginx, invoiceninja.

- name: Capture private recovery checkpoint before rendering or pulling
  ansible.builtin.include_tasks: checkpoint.yml
  when: not ansible_check_mode

- name: Render Docker Compose project
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ football_club_project_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0644"
  become: true

- name: Render environment file from Ansible Vault values
  ansible.builtin.template:
    src: env.j2
    dest: "{{ football_club_project_dir }}/.env"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0600"
  become: true
  no_log: true

- name: Validate rendered Docker Compose config
  ansible.builtin.command:
    cmd: >
      docker compose -f {{ football_club_project_dir }}/docker-compose.yml
      --env-file {{ football_club_project_dir }}/.env config
  register: football_club_stack_compose_config_result
  changed_when: false
  no_log: true

- name: Create nginx config directory
  ansible.builtin.file:
    path: "{{ football_club_project_dir }}/nginx"
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Deploy nginx InvoiceNinja config
  ansible.builtin.template:
    src: invoiceninja.conf
    dest: "{{ football_club_project_dir }}/nginx/invoiceninja.conf"
    owner: root
    group: root
    mode: "0644"
  become: true

- name: Deploy nginx Laravel config
  ansible.builtin.template:
    src: laravel.conf
    dest: "{{ football_club_project_dir }}/nginx/laravel.conf"
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Restart nginx after stack update

- name: Deploy nginx host proxy startup script
  ansible.builtin.template:
    src: start-nginx.sh
    dest: "{{ football_club_project_dir }}/nginx/start-nginx.sh"
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Restart nginx after stack update

- name: Prepare InvoiceNinja Docker volumes
  ansible.builtin.command:
    cmd: docker volume create {{ football_club_compose_project_name }}_app_storage
  register: football_club_stack_app_storage_volume_result
  changed_when: >
    football_club_stack_app_storage_volume_result.stdout ==
    football_club_compose_project_name ~ '_app_storage'

- name: Initialize InvoiceNinja storage volume for ninja user
  ansible.builtin.command:
    cmd: >
      docker run --rm --pull never
      -v {{ football_club_compose_project_name }}_app_storage:/mnt/ninja-volume
      {{ football_club_stack_checkpoint_helper_image }}
      sh -c 'mkdir -p
      /mnt/ninja-volume/framework/cache/data
      /mnt/ninja-volume/framework/sessions
      /mnt/ninja-volume/framework/views
      /mnt/ninja-volume/logs
      && chown -R 33:33 /mnt/ninja-volume
      && (chmod -R u+rwX,g+rwX,o-rwx /mnt/ninja-volume 2>/dev/null || true)'
  changed_when: false

- name: Pull all registry-backed release images before startup
  ansible.builtin.command:
    cmd: >
      docker compose -p {{ football_club_compose_project_name }}
      -f {{ football_club_project_dir }}/docker-compose.yml
      --env-file {{ football_club_project_dir }}/.env
      pull --policy always {{ football_club_stack_refresh_services | join(' ') }}
  register: football_club_stack_release_pull_result
  changed_when: >
    'Downloaded newer image' in football_club_stack_release_pull_result.stderr or
    'Pull complete' in football_club_stack_release_pull_result.stderr or
    'Pulling' in football_club_stack_release_pull_result.stderr
  when: not ansible_check_mode

- name: Start football club stack
  ansible.builtin.command:
    cmd: >
      docker compose -p {{ football_club_compose_project_name }}
      -f {{ football_club_project_dir }}/docker-compose.yml
      --env-file {{ football_club_project_dir }}/.env up -d --pull never
  register: football_club_stack_compose_up_result
  changed_when: >
    'Started' in football_club_stack_compose_up_result.stderr or
    'Created' in football_club_stack_compose_up_result.stderr or
    'Recreated' in football_club_stack_compose_up_result.stderr
  no_log: false
  when: not ansible_check_mode
  notify: Restart nginx after stack update

- name: Record post-start image identities without secrets
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - "{{ football_club_stack_checkpoint_dir }}/checkpoint.py"
      - --project
      - "{{ football_club_compose_project_name }}"
      - --timeout
      - "{{ football_club_stack_checkpoint_timeout_seconds | string }}"
      - --checkpoint-dir
      - "{{ football_club_stack_checkpoint_dir }}"
      - record
  register: football_club_stack_image_record_result
  changed_when: false
  when: not ansible_check_mode
  become: true
