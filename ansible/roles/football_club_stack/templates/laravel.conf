# https://laravel.com/docs/master/deployment#nginx
include /tmp/football-club-host-proxy.conf;

# Only the verified host ingress may describe TLS; container peers use HTTP.
map "$football_club_host_proxy:$http_x_forwarded_proto" $football_club_https {
    default "";
    "1:https" on;
}
map $football_club_https $football_club_scheme {
    default http;
    on https;
}
map $football_club_https $football_club_port {
    default $server_port;
    on 443;
}

server {
    listen 80 default_server;
    server_name _;   
    root /var/www/html/public;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    index index.php;
 
    charset utf-8;
 
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
 
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }
 
    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass invoiceninja:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param HTTPS $football_club_https if_not_empty;
        fastcgi_param REQUEST_SCHEME $football_club_scheme;
        fastcgi_param SERVER_PORT $football_club_port;

        # PHP receives normalized CGI values, never a second forwarded-header
        # trust chain. Keep ordinary Host, authentication and cookie headers.
        fastcgi_param HTTP_FORWARDED "";
        fastcgi_param HTTP_X_FORWARDED_FOR "";
        fastcgi_param HTTP_X_FORWARDED_HOST "";
        fastcgi_param HTTP_X_FORWARDED_PROTO "";
        fastcgi_param HTTP_X_FORWARDED_PORT "";
        fastcgi_param HTTP_X_FORWARDED_PREFIX "";
        fastcgi_param HTTP_X_FORWARDED_SSL "";
        fastcgi_param HTTP_X_FORWARDED_SERVER "";
        fastcgi_param HTTP_X_REAL_IP "";
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
